name: CI

# Lint and the test suite on every push. The tests that matter most are the
# clinical-safety ones (critical findings, the release gate, de-identification):
# a change to those rules must not reach a report unchecked.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # PySide6 needs these to import, even headless.
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
