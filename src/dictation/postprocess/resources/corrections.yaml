# Shipped correction rules: the data-driven spelling-fix layer.
#
# This file is REVIEWED and version-controlled. Site-specific rules added
# through the app land in `user_corrections.yaml` (data dir), not here.
#
# Each rule:
#   id:              short kebab-case identifier (for the miner / logs)
#   pattern:         the misheard word (literal); or a raw regex if `regex: true`
#   replacement:     the corrected text
#   context_after:   (optional) only fire when followed by one of these words
#   context_before:  (optional) only fire when preceded by one of these words
#   case_sensitive:  (optional, default false)
#   regex:           (optional, default false) treat `pattern` as raw regex
#   note:            (optional) why the rule exists
#
# Context guards keep real-word homophones safe: "plural" is only rewritten to
# "pleural" before an anatomical word, so grammatical "plural form" is left alone.
#
# After adding a rule here, add an input->expected case to
# tests/test_corrections_rules.py and run pytest.

- id: pleural-homophone
  pattern: "plural"
  replacement: "pleural"
  context_after:
    - effusion
    - effusions
    - space
    - spaces
    - cavity
    - thickening
    - plaque
    - plaques
    - reaction
    - based
    - surface
    - line
    - fluid
    - disease
    - nodule
    - nodules
    - tail
    - tails
  note: "real-word homophone; grammatical 'plural' (form/verb/noun) is untouched"

- id: cholecystitis-mishear
  pattern: "co?al?esc?[iy]stic"
  replacement: "cholecystitis"
  regex: true
  note: "Whisper mishears 'cholecystitis' as 'coalescistic' and variants"

- id: hila-homophone
  pattern: "hyla"
  replacement: "hila"
  note: >-
    real-word homophone: "hyla" is a genus of tree frog, so the spell-checker
    and the fuzzy stage both pass it through untouched and nothing underlines
    it. It never occurs in a report, so no context guard is needed. Observed
    2026-09-19: "the hyla are unremarkable in contour".

- id: hilar-homophone
  pattern: "hylar"
  replacement: "hilar"
  note: "same mishear, adjectival form; 'hylar' is not an English word"

- id: venous-homophone
  pattern: "venus"
  replacement: "venous"
  note: >-
    never valid in a report (the planet). Measured 2026-10-23: Parakeet wrote
    "venus" for "venous" 7 times across 4 of 5 voices on the piper set.

- id: computed-tomography
  pattern: "computer"
  replacement: "computed"
  context_after:
    - tomography
    - tomographic
  note: >-
    "computer tomography" is not the modality's name. Measured 2026-10-23:
    5 times on the piper set (Parakeet). Only before "tomography".

